name: Build local helper
on:
  workflow_dispatch:
  push:
    tags:
      - 'helper-v*'
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
          - os: ubuntu-latest
            artifact: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: helper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests -q
      - name: Package helper
        run: python -m PyInstaller --noconfirm build.spec
      - name: Archive and checksum (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -czf ViralIA-Helper-${{ matrix.artifact }}.tar.gz -C dist ViralIA-Helper
          shasum -a 256 ViralIA-Helper-${{ matrix.artifact }}.tar.gz > ViralIA-Helper-${{ matrix.artifact }}.sha256
      - name: Archive and checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/ViralIA-Helper.exe -DestinationPath ViralIA-Helper-windows.zip
          (Get-FileHash ViralIA-Helper-windows.zip -Algorithm SHA256).Hash + '  ViralIA-Helper-windows.zip' | Set-Content ViralIA-Helper-windows.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: helper-${{ matrix.artifact }}
          path: |
            helper/ViralIA-Helper-*.zip
            helper/ViralIA-Helper-*.tar.gz
            helper/ViralIA-Helper-*.sha256
