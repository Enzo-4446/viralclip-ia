services:
  - type: web
    name: viralclip-ffmpeg
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_ORIGIN
        value: https://enzo-4446.github.io
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
