<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d19"><title>ViralClip IA</title><style>body{font:16px system-ui;background:#090d19;color:#eee;margin:0}main{max-width:680px;margin:5vh auto;padding:24px}section{background:#171d31;border:1px solid #333d5e;border-radius:18px;padding:24px;margin-top:18px}input,button{box-sizing:border-box;width:100%;padding:14px;margin:7px 0 15px;border-radius:10px;font-size:16px}input{background:#0b1020;border:1px solid #465171;color:white}button{background:#835bff;color:white;border:0;font-weight:700}button:disabled{opacity:.5}a{color:#c4adff}small,p{color:#b7c0d7}#app[hidden],#auth[hidden]{display:none}</style></head><body><main><h1>🎬 ViralClip <span style="color:#ac8dff">IA</span></h1><p>Seu estúdio privado de cortes verticais</p><section id="auth"><h2>Entrar</h2><input id="email" type="email" placeholder="E-mail" autocomplete="email"><input id="password" type="password" placeholder="Senha" autocomplete="current-password"><button id="signin">Entrar</button><button id="signup">Criar conta</button><p id="authStatus" role="status"></p></section><section id="app" hidden><button id="signout">Sair</button><h2>Gerar clipe</h2><label>Vídeo próprio ou autorizado</label><input id="file" type="file" accept="video/mp4,video/quicktime,video/x-matroska"><label>Marca d'água</label><input id="brand" maxlength="32" value="VIRALCLIP"><label>Nome do projeto</label><input id="title" maxlength="150" value="Meu primeiro clipe"><label>Início do trecho (segundos)</label><input id="start" type="number" min="0" value="0"><label>Duração</label><select id="duration"><option value="45">45 segundos</option><option value="60">60 segundos</option></select><button id="generate">Gerar MP4</button><p id="status" role="status"></p><a id="download" hidden download="viralclip.mp4">Salvar MP4 no dispositivo</a><h2>Meus projetos</h2><div id="projects"></div></section><p><small>O processamento depende do servidor FFmpeg. Conteúdo de terceiros requer autorização. Esta versão ainda não seleciona automaticamente os momentos virais.</small></p></main><script type="module" src="/src.js"></script></body></html>
